<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>取扱店検索 | いい街こまつプレミアム</title>
  <style>
    :root {
      --brand-ink: #60363f;
      --brand-ink-dark: #3b2228;
      --brand-green: #0f8f52;
      --brand-green-soft: #e7f4ec;
      --brand-cream: #f6f2e8;
      --brand-cream-soft: #fbf8f1;
      --line-soft: #e3d9c5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      background:
        radial-gradient(circle at 15% 0%, #fffdf7 0%, #f7f1e3 35%, #f4ecdd 100%);
      color: #2f2a2b;
      padding-bottom: 40px;
    }
    
    /* ヘッダーエリアのデザイン */
    .site-header {
      background:
        linear-gradient(180deg, #050505 0%, #0d0d0d 100%);
      color: #fff;
      padding: 18px 16px 16px;
      border-bottom: 4px solid rgba(120, 64, 72, 0.85);
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
    }
    .site-header::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(120, 64, 72, 0.04), rgba(255,255,255,0), rgba(120, 64, 72, 0.04));
      pointer-events: none;
    }
    .header-container {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      position: relative;
      z-index: 1;
    }
    .header-content {
      flex: 1;
    }
    .sub-title {
      font-size: 14px;
      color: #e8d9be;
      display: inline-block;
      padding: 2px 0;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: 0.1em;
    }
    .main-title {
      font-size: 0;
      margin-top: 4px;
    }
    .header-logo-img {
      width: min(720px, 100%);
      height: auto;
      display: block;
    }
    .logo-text {
      font-size: 32px;
      font-weight: 800;
      line-height: 1.2;
      color: var(--brand-ink);
    }
    .period-info {
      font-size: 13px;
      margin-top: 12px;
      color: #fff3da;
      display: inline-block;
      padding: 6px 12px;
      border: 1px solid rgba(255, 243, 218, 0.45);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
    }
    /* メインコンテンツエリア */
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: var(--brand-cream-soft);
      padding: 24px;
      border-radius: 12px;
      border: 1px solid var(--line-soft);
      box-shadow: 0 10px 24px rgba(48, 36, 24, 0.08);
    }
    
    .search-box {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      background: #f4ecdd;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--line-soft);
    }
    .search-box input[type="text"],
    .search-box select {
      flex: 1;
      min-width: 200px;
      padding: 10px 14px;
      font-size: 15px;
      border: 1px solid #c9bba3;
      border-radius: 6px;
      outline: none;
      background: #fffefb;
      transition: border-color 0.2s;
    }
    .search-box input[type="text"]:focus,
    .search-box select:focus {
      border-color: var(--brand-green);
    }
    .stats {
      font-size: 14px;
      color: #63544d;
      margin-bottom: 12px;
      text-align: right;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 12px 14px;
      text-align: left;
      border-bottom: 1px solid #e7dcc8;
      font-size: 14px;
    }
    th {
      background-color: var(--brand-ink);
      color: #ffffff;
      font-weight: 600;
      position: sticky;
      top: 0;
    }
    tr:nth-child(even) {
      background-color: #f9f3e8;
    }
    tr:hover {
      background-color: #ece3d2;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      font-size: 12px;
      border-radius: 4px;
      background-color: var(--brand-green-soft);
      color: #166f45;
      font-weight: 500;
    }
    .no-result {
      text-align: center;
      padding: 30px;
      color: #888;
      font-size: 15px;
    }

    @media (max-width: 768px) {
      .header-container {
        flex-direction: column;
        align-items: flex-start;
      }
      .sub-title {
        font-size: 12px;
      }
      .header-banner-img {
        width: 140px;
      }
      .header-logo-img {
        width: 100%;
        max-width: 560px;
      }
      .period-info {
        border-radius: 10px;
      }
    }
  </style>
</head>
<body>

<!-- ヘッダーエリア -->
<header class="site-header">
  <div class="header-container">
    <div class="header-content">
      <div class="sub-title">小松市プレミアム付商品券</div>
      <h1 class="main-title">
        <img class="header-logo-img" src="header.png" alt="いい街こまつプレミアム 2026" />
      </h1>
      <div class="period-info">利用期間: 令和8年6月24日(水) 〜 10月31日(土)</div>
    </div>
    
  </div>
</header>

<div class="container">
  <!-- 検索コントロールエリア -->
  <div class="search-box">
    <input type="text" id="keywordInput" placeholder="店舗名や住所で検索...">
    
    <select id="categorySelect">
      <option value="">すべての業種・カテゴリ</option>
    </select>

    <select id="facilitySelect">
      <option value="">すべての区分（施設/全般）</option>
      <option value="業種別">一般店舗（路面店等）</option>
      <option value="アル・プラザ小松">アル・プラザ小松</option>
      <option value="イオン小松店">イオン小松店</option>
      <option value="イオンモール新小松">イオンモール新小松</option>
    </select>
  </div>

  <div class="stats" id="statsArea">該当店舗: 0 件</div>

  <!-- 結果表示テーブル -->
  <table>
    <thead>
      <tr>
        <th style="width: 25%;">カテゴリ/業種</th>
        <th style="width: 35%;">店舗名</th>
        <th style="width: 20%;">施設・区分</th>
        <th style="width: 20%;">住所</th>
      </tr>
    </thead>
    <tbody id="shopTableBody">
      <tr>
        <td colspan="4" class="no-result">データを読み込み中...</td>
      </tr>
    </tbody>
  </table>
</div>

<script>
  let storesData = [];

  const keywordInput = document.getElementById('keywordInput');
  const categorySelect = document.getElementById('categorySelect');
  const facilitySelect = document.getElementById('facilitySelect');
  const shopTableBody = document.getElementById('shopTableBody');
  const statsArea = document.getElementById('statsArea');

  // JSONデータの読み込み（外部ファイル stores.json）
  fetch('stores.json')
    .then(response => {
      if (!response.ok) {
        throw new Error('HTTPエラー: ' + response.status);
      }
      return response.json();
    })
    .then(data => {
      storesData = data;
      initCategoryOptions(data);
      renderTable(storesData);
    })
    .catch(error => {
      console.error('読み込み失敗:', error);
      shopTableBody.innerHTML = `<tr><td colspan="4" class="no-result" style="color:red;">データの読み込みに失敗しました。<br><code>stores.json</code> が同一フォルダに存在するか確認してください。</td></tr>`;
    });

  function initCategoryOptions(data) {
    const categories = new Set();
    data.forEach(item => {
      if (item.category) categories.add(item.category);
    });

    Array.from(categories).sort().forEach(cat => {
      const option = document.createElement('option');
      option.value = cat;
      option.textContent = cat;
      categorySelect.appendChild(option);
    });
  }

  function renderTable(data) {
    shopTableBody.innerHTML = '';
    statsArea.textContent = `該当店舗: ${data.length} 件`;

    if (data.length === 0) {
      shopTableBody.innerHTML = '<tr><td colspan="4" class="no-result">条件に一致する店舗は見つかりませんでした。</td></tr>';
      return;
    }

    const fragment = document.createDocumentFragment();

    data.forEach(item => {
      const tr = document.createElement('tr');
      const facilityText = item.facility_name ? item.facility_name : (item.facility_type || '-');

      tr.innerHTML = `
        <td><span class="badge">${escapeHtml(item.category || '-')}</span></td>
        <td><strong>${escapeHtml(item.shop_name || '-')}</strong></td>
        <td>${escapeHtml(facilityText)}</td>
        <td>${escapeHtml(item.address || '-')}</td>
      `;
      fragment.appendChild(tr);
    });

    shopTableBody.appendChild(fragment);
  }

  function filterStores() {
    const keyword = keywordInput.value.toLowerCase().trim();
    const selectedCategory = categorySelect.value;
    const selectedFacility = facilitySelect.value;

    const filtered = storesData.filter(item => {
      const matchesKeyword = !keyword || 
        (item.shop_name && item.shop_name.toLowerCase().includes(keyword)) ||
        (item.address && item.address.toLowerCase().includes(keyword));

      const matchesCategory = !selectedCategory || item.category === selectedCategory;

      let matchesFacility = true;
      if (selectedFacility) {
        if (selectedFacility === '業種別') {
          matchesFacility = item.facility_type === '業種別' && !item.facility_name;
        } else {
          matchesFacility = item.facility_name === selectedFacility;
        }
      }

      return matchesKeyword && matchesCategory && matchesFacility;
    });

    renderTable(filtered);
  }

  function escapeHtml(str) {
    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  keywordInput.addEventListener('input', filterStores);
  categorySelect.addEventListener('change', filterStores);
  facilitySelect.addEventListener('change', filterStores);
</script>

</body>
</html>
